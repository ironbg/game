# Publishes the browser version to Firebase Hosting (https://dreadhollow-b49c7.web.app).
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key from
# Firebase console → Project settings → Service accounts → Generate new private key.
name: Deploy web version
on:
  push:
    branches: [dreadhollow]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/check-i18n.js
      - run: node tools/build-www.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dreadhollow-b49c7
          channelId: live
